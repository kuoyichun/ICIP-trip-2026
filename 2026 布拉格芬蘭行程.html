<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16202b">
<title>2026 布拉格 · 芬蘭行程</title>
<style>
:root{
  --ink:#16202b; --muted:#6d7d8b; --line:#dfe5ea;
  --bg:#e9edf1; --card:#fff; --accent:#a8412a;
  --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  font-size:15px; line-height:1.6;
  padding-bottom:env(safe-area-inset-bottom);
}
.wrap{max-width:560px;margin:0 auto}
b,strong{font-weight:700}
a{color:inherit}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* ---------- now bar ---------- */
header.now{
  position:sticky; top:0; z-index:60;
  background:var(--ink); color:#fff;
  padding:calc(10px + env(safe-area-inset-top)) 16px 0;
}
.nb-row1{display:flex;align-items:center;gap:8px;font-size:13px;color:#a9bccb}
.pin{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(255,255,255,.14);flex:none}
.nb-city{color:#fff;font-weight:700;font-size:15px}
.nb-day{margin-left:auto;background:rgba(255,255,255,.1);padding:2px 9px;border-radius:20px;font-size:12px}
.clocks{display:flex;align-items:baseline;gap:14px;margin:2px 0 4px}
#localTime{font-size:40px;font-weight:700;line-height:1.1;transition:font-size .18s ease}
.clocks .sm{font-size:13px;color:#9db0c0}
.clocks .sm b{font-size:15px;color:#dbe6ee;font-weight:600}
.nowline{
  border-top:1px solid rgba(255,255,255,.12);
  padding:9px 0 11px; display:flex; gap:10px; align-items:flex-start;
}
.nowline .txt{flex:1;min-width:0}
.nl-lead{font-size:11.5px;color:#93a8b8;margin-bottom:1px}
.nl-title{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nl-next{font-size:12.5px;color:#9db0c0;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gobtn{
  flex:none;background:#fff;color:var(--ink);border:0;border-radius:11px;
  padding:9px 12px;font-size:13px;font-weight:700;font-family:inherit;
  display:flex;align-items:center;gap:5px;text-decoration:none
}
header.now.compact #localTime{font-size:23px}
header.now.compact .nl-next,header.now.compact .nl-lead{display:none}
header.now.compact .nowline{padding:6px 0 8px}
header.now.compact .clocks{margin:0}

/* ---------- tabs ---------- */
nav.tabs{
  display:flex;background:var(--ink);
  padding:0 0 9px;gap:6px
}
nav.tabs button{
  flex:1;background:rgba(255,255,255,.08);color:#cfdde8;border:0;
  font-family:inherit;font-size:13.5px;font-weight:600;padding:8px 0;border-radius:9px
}
nav.tabs button[aria-selected="true"]{background:#fff;color:var(--ink)}
nav.tabs button:focus-visible{outline:2px solid #fff;outline-offset:2px}

main{padding:14px 12px 60px}
section[hidden]{display:none}

/* ---------- day card ---------- */
.day{background:var(--card);border-radius:var(--radius);margin-bottom:12px;overflow:hidden}
.day-head{
  display:flex;align-items:center;gap:10px;width:100%;
  border:0;background:none;font-family:inherit;text-align:left;
  padding:13px 14px;color:var(--ink);border-left:4px solid var(--dc,#ccc)
}
.day-head .dn{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.day-head .dt{font-weight:700;font-size:15px;display:block}
.day-head .chev{margin-left:auto;color:var(--muted);font-size:12px;transition:transform .2s}
.day[open-state] .chev{transform:rotate(90deg)}
.day-body{padding:2px 14px 14px;border-top:1px solid var(--line)}
.today-flag{background:var(--dc);color:#fff;font-size:11px;padding:1px 7px;border-radius:20px;margin-left:6px}

/* ---------- timeline ---------- */
ol.tl{list-style:none;margin:0;padding:0}
ol.tl li{display:grid;grid-template-columns:46px 16px 1fr;gap:0;position:relative;padding:9px 0}
ol.tl li .t{font-size:13px;font-weight:600;color:var(--muted);padding-top:1px;font-variant-numeric:tabular-nums}
ol.tl li .rail{position:relative}
ol.tl li .rail::before{content:"";position:absolute;left:5px;top:-9px;bottom:-9px;width:1px;background:var(--line)}
ol.tl li:first-child .rail::before{top:12px}
ol.tl li:last-child .rail::before{bottom:auto;height:14px}
ol.tl li .rail::after{
  content:"";position:absolute;left:1px;top:6px;width:9px;height:9px;border-radius:50%;
  background:#fff;border:2px solid var(--line)
}
ol.tl li.done{opacity:.42}
ol.tl li.done .rail::after{background:var(--line);border-color:var(--line)}
ol.tl li.cur{background:#fff9f4;margin:0 -8px;padding:9px 8px;border-radius:10px;box-shadow:inset 3px 0 0 var(--dc)}
ol.tl li.cur .rail::after{background:var(--dc);border-color:var(--dc);box-shadow:0 0 0 4px color-mix(in srgb,var(--dc) 18%,transparent)}
ol.tl li.cur .t{color:var(--dc)}
.itrow{display:flex;gap:10px;align-items:flex-start}
.itxt{flex:1;min-width:0}
.thumb{
  flex:none;width:62px;height:62px;border-radius:10px;background:#e9edf1;overflow:hidden;
  position:relative;display:flex;align-items:center;justify-content:center
}
.thumb .ico{font-size:23px;opacity:.75}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s}
.thumb img.on{opacity:1}
.thumb.sq{width:52px;height:52px;border-radius:9px}
.thumb.sq .ico{font-size:19px}
.it-title{font-size:14.5px}
.it-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{font-size:11.5px;padding:2px 8px;border-radius:20px;background:#eef2f5;color:var(--muted)}
.tag.you{background:#e7eff6;color:#2b5f8c}
.tag.par{background:#eaf1ec;color:#3d6b4d}
.tag.all{background:#f6eee7;color:#8a5433}
.tag.star{background:#fdf0e3;color:#9a5c12;font-weight:600}
.maplink{
  font-size:11.5px;padding:2px 9px 3px;border-radius:20px;text-decoration:none;
  background:#16202b;color:#fff;display:inline-flex;gap:4px;align-items:center;font-weight:600
}
.nowmark{display:flex;align-items:center;gap:8px;margin:4px 0 4px 46px;color:var(--dc);font-size:11.5px;font-weight:700}
.nowmark::after{content:"";flex:1;height:1px;background:var(--dc);opacity:.4}

details.tips{margin-top:10px;background:#f5f7f9;border-radius:10px;padding:0 12px}
details.tips summary{padding:10px 0;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;list-style:none}
details.tips summary::-webkit-details-marker{display:none}
details.tips summary::before{content:"＋ ";color:var(--dc)}
details.tips[open] summary::before{content:"－ "}
details.tips .body{padding-bottom:12px;font-size:13px;color:#3c4c5a}
details.tips .body p{margin:0 0 8px}
details.tips .body p:last-child{margin-bottom:0}

/* ---------- map ---------- */
.daypick{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px;-webkit-overflow-scrolling:touch}
.daypick button{
  flex:none;border:1px solid var(--line);background:#fff;color:var(--muted);
  font-family:inherit;font-size:12.5px;font-weight:600;padding:7px 11px;border-radius:20px;
  font-variant-numeric:tabular-nums
}
.daypick button[aria-selected="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.mapbox{margin:0 0 10px;background:#e3e8ec;border-radius:var(--radius);overflow:hidden}
.mapwrap{position:relative}
.loc{
  position:absolute;width:23%;max-width:100px;min-width:62px;
  background:rgba(255,255,255,.94);border:1px solid #ccd5db;border-radius:9px;
  padding:5px 5px 4px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.08)
}
.loc svg{display:block;width:100%;height:auto;border-radius:4px}
.loc-fi{width:16%;max-width:72px;min-width:52px}
.loc b{display:block;font-size:9.5px;line-height:1.35;margin-top:3px;color:var(--ink)}
.loc span{display:block;font-size:9.5px;color:var(--muted);line-height:1.3}
.loc-br{right:8px;bottom:8px}
.loc-tl{left:8px;top:8px}
.mapsvg{display:block;width:100%;height:auto;max-height:64vh}
.mapbox.mini .mapsvg{max-height:380px}
.mapbox figcaption{font-size:12px;color:var(--muted);padding:7px 12px 10px;text-align:center;background:#fff}
.minimap{margin:12px 0 4px}
.maphint{font-size:12px;color:var(--muted);margin:2px 2px 10px;line-height:1.5}
.tinybtn{border:1px solid var(--line);background:#fff;color:var(--ink);font-family:inherit;
  font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:20px}
.plist{background:#fff;border-radius:var(--radius);margin-top:12px;overflow:hidden}
.plist button.prow{
  display:flex;width:100%;gap:10px;align-items:center;border:0;background:none;font-family:inherit;
  text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);color:var(--ink)
}
.plist button.prow:last-child{border-bottom:0}
.prow .pn{font-size:14px}
.prow .pd{font-size:11.5px;color:var(--muted);margin-top:1px}
.prow .go{margin-left:auto;font-size:11.5px;color:#fff;background:var(--ink);padding:3px 9px;border-radius:20px;flex:none}
/* ---------- handbook ---------- */
.hb{background:#fff;border-radius:var(--radius);margin-bottom:12px;padding:0 14px}
.hb > summary{padding:14px 0;font-weight:700;font-size:15px;list-style:none;cursor:pointer;display:flex;align-items:center}
.hb > summary::-webkit-details-marker{display:none}
.hb > summary::after{content:"＋";margin-left:auto;color:var(--muted)}
.hb[open] > summary::after{content:"－"}
.hb .hbody{padding-bottom:14px;border-top:1px solid var(--line);padding-top:12px;font-size:13.5px}
.hb h4{margin:14px 0 6px;font-size:13.5px}
.hb h4:first-child{margin-top:0}
.hb ul{margin:0 0 10px;padding-left:18px}
.hb li{margin-bottom:5px}
.todo{list-style:none;padding:0;margin:0}
.todo li{display:flex;gap:9px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.todo li:last-child{border:0}
.st{font-size:11px;padding:2px 8px;border-radius:20px;flex:none;margin-top:2px;font-weight:600}
.st.wait{background:#fdece4;color:#a8412a}
.st.ok{background:#e7f0ea;color:#35704f}
.st.pre{background:#eaf0f6;color:#33587f}
table.mini{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:10px}
table.mini th,table.mini td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.mini th{color:var(--muted);font-weight:600;font-size:12px}
.warn{background:#fdf3ec;border-radius:10px;padding:10px 12px;font-size:13px;margin:10px 0;color:#7d3f21}
footer{text-align:center;color:var(--muted);font-size:11.5px;padding:18px 20px 34px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

  </div>

    <div class="txt">

      <div class="nl-next" id="nlNext"></div>

<main>
  <section id="view-today"></section>

    <div class="plist" id="pList"></div>
  </section>

  <section id="view-book" hidden></section>
</main>

<footer>2026/09/10–09/24　布拉格・坦佩雷・羅瓦涅米・赫爾辛基<br>時間依當地時區自動換算</footer>
</div>

/* ============ 工具 ============ */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const gmap=q=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);
const cityOf=(day,it)=>CITY[it&&it.city?it.city:day.city];
function ts(day,it){ if(!it.t) return null; const c=cityOf(day,it); return new Date(day.d+'T'+it.t+':00'+c.off).getTime(); }
function fmt(tz,d){ return new Intl.DateTimeFormat('zh-TW',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:tz}).format(d); }

const FLAT=[];
DAYS.forEach((day,di)=>day.items.forEach((it,ii)=>{const m=ts(day,it); if(m!==null) FLAT.push({m,di,ii,day,it});}));
FLAT.sort((a,b)=>a.m-b.m);

function current(now){
  let cur=null,next=null;
  for(const f of FLAT){ if(f.m<=now) cur=f; else {next=f;break;} }
  return {cur,next};
}
function todayIndex(now){
  for(let i=0;i<DAYS.length;i++){
    const c=CITY[DAYS[i].city];
    const s=new Date(DAYS[i].d+'T00:00:00'+c.off).getTime();
    const e=s+24*3600*1000;
    if(now>=s&&now<e) return i;
  }
  return now<new Date(DAYS[0].d+'T00:00:00+02:00').getTime()?0:DAYS.length-1;
}

/* ============ 現在列 ============ */
function tickNow(){
  const now=Date.now(), d=new Date(now);
  const {cur,next}=current(now);
  const ref=cur||next||FLAT[0];
  const day=ref.day, it=ref.it, c=cityOf(day,it);
  document.documentElement.style.setProperty('--accent',c.c);
  $('#nbPin').style.background=c.c;
  $('#nbCity').textContent=c.n;
  $('#nbSub').textContent=c.sub;
  $('#localTime').textContent=fmt(c.tz,d);
  $('#tpeTime').textContent=fmt('Asia/Taipei',d);
  const ti=todayIndex(now);
  const td=DAYS[ti];
  $('#nbDay').textContent='Day '+(ti+1)+' · '+td.d.slice(5).replace('-','/')+' '+td.w;

  const before=now<FLAT[0].m;
  if(before){
    $('#nlLead').textContent='行程尚未開始';
    $('#nlTitle').textContent='第一站：'+FLAT[0].it.x;
  }else{
    $('#nlLead').textContent='現在'+(cur?'（'+cur.it.t+' 起）':'');
    $('#nlTitle').textContent=cur?cur.it.x:'行程已結束';
  }
  if(next){
    const mins=Math.round((next.m-now)/60000);
    const left=mins>=60?Math.floor(mins/60)+' 小時 '+(mins%60)+' 分':mins+' 分鐘';
    $('#nlNext').textContent='接下來 '+next.it.t+'　'+next.it.x+'（還有 '+left+'）';
  }else $('#nlNext').textContent='';

  const pk=(cur&&cur.it.p)||(next&&next.it.p);
  const btn=$('#nlMap');
  if(pk){ btn.hidden=false; btn.href=gmap(P[pk].q); btn.textContent='開地圖'; }
  else btn.hidden=true;
}

/* ============ 行程渲染 ============ */
function itemHTML(day,it,now){
  const m=ts(day,it);
  const {cur}=current(now);
  const isCur=cur&&cur.day===day&&cur.it===it;
  const done=m!==null&&m<now&&!isCur;
  const tags=[];
  if(it.who==='you')tags.push('<span class="tag you">Titi</span>');
  if(it.who==='par')tags.push('<span class="tag par">其他成員</span>');
  if(it.who==='all')tags.push('<span class="tag all">全體</span>');
  if(it.star)tags.push('<span class="tag star">重要</span>');
  if(it.p)tags.push('<a class="maplink" target="_blank" rel="noopener" href="'+gmap(P[it.p].q)+'">'+ICO(it.p)+' '+P[it.p].n.split('（')[0]+'</a>');
  return '<li class="'+(isCur?'cur':(done?'done':''))+'">'+
    '<span class="t">'+(it.tl||it.t||'　')+'</span><span class="rail"></span>'+
    '<div class="itrow"><div class="itxt"><div class="it-title">'+it.x+'</div>'+
    (it.s?'<div class="it-sub">'+it.s+'</div>':'')+
    (tags.length?'<div class="tags">'+tags.join('')+'</div>':'')+
    '</div>'+thumbHTML(it.p)+'</div></li>';
}
function dayHTML(day,di,now,open){
  const c=CITY[day.city];
  const ti=todayIndex(now);
  const isToday=ti===di;
  const md=day.d.slice(5).replace('-','/');
  let body='<div class="minimap" data-di="'+di+'">'+(open?dayMapHTML(di,1):'')+'</div>'+
           '<ol class="tl">'+day.items.map(it=>itemHTML(day,it,now)).join('')+'</ol>';
  if(day.notes&&day.notes.length){
    body+='<details class="tips"><summary>這天的提醒（'+day.notes.length+'）</summary><div class="body">'+
      day.notes.map(n=>'<p>'+n+'</p>').join('')+'</div></details>';
  }
  return '<article class="day" style="--dc:'+c.c+'" data-di="'+di+'">'+
    '<button class="day-head" aria-expanded="'+(open?'true':'false')+'">'+
      '<span><span class="dn">Day '+(di+1)+' · '+md+'（'+day.w+'）· '+c.n+'</span>'+
      '<span class="dt">'+day.t+(isToday?'<span class="today-flag">今天</span>':'')+'</span></span>'+
      '<span class="chev">'+(open?'▾':'▸')+'</span>'+
    '</button>'+
    '<div class="day-body"'+(open?'':' hidden')+'>'+body+'</div></article>';
}
function renderToday(){
  const now=Date.now(), ti=todayIndex(now);
  let h=dayHTML(DAYS[ti],ti,now,true);
  if(ti+1<DAYS.length) h+=dayHTML(DAYS[ti+1],ti+1,now,false);
  $('#view-today').innerHTML=h;
  bindDays($('#view-today'));
}
function renderAll(){
  const now=Date.now(), ti=todayIndex(now);
  $('#view-all').innerHTML=DAYS.map((d,i)=>dayHTML(d,i,now,i===ti)).join('');
  bindDays($('#view-all'));
}
function bindDays(root){
  root.querySelectorAll('.day-head').forEach(b=>{
    b.addEventListener('click',()=>{
      const body=b.nextElementSibling, open=body.hidden;
      body.hidden=!open; b.setAttribute('aria-expanded',open);
      if(open){ const mm=body.querySelector('.minimap');
        if(mm&&!mm.innerHTML) mm.innerHTML=dayMapHTML(Number(mm.dataset.di),1); applyThumbs(); }
      b.querySelector('.chev').textContent=open?'▾':'▸';
    });
  });
}

function applyThumbs(){
  document.querySelectorAll('img.th[data-pk]').forEach(im=>{
    const u=IMGU[im.dataset.pk];
    if(u&&im.getAttribute('src')!==u){ im.src=u; im.onload=()=>im.classList.add('on'); }
  });

}
let _jn=0;
function jsonp(u){
  return new Promise((res,rej)=>{
    const cb='__wcb'+(++_jn), s=document.createElement('script');
    const t=setTimeout(()=>{done();rej(0)},9000);
    function done(){clearTimeout(t);try{delete window[cb]}catch(e){};if(s.parentNode)s.parentNode.removeChild(s)}
    window[cb]=d=>{done();res(d)};
    s.onerror=()=>{done();rej(0)};
    s.src=u.replace('&origin=*','')+'&callback='+cb;
    document.head.appendChild(s);
  });
}
async function jget(u){
  try{ if(typeof fetch==='function'){ const r=await fetch(u); if(r.ok) return await r.json(); } }catch(e){}
  return jsonp(u);
}
function wikiURL(lang,extra){
  return 'https://'+lang+'.wikipedia.org/w/api.php?action=query&format=json&origin=*&formatversion=2'+
         '&prop=pageimages&piprop=thumbnail&pithumbsize=480&'+extra;
}
function pickThumbs(j,reqs){
  const q=(j&&j.query)||{}, step={}, out={};
  (q.normalized||[]).forEach(n=>step[n.from]=n.to);
  (q.redirects||[]).forEach(n=>step[n.from]=n.to);
  const by={}; (q.pages||[]).forEach(p=>{ if(p.thumbnail) by[p.title]=p.thumbnail.source; });
  reqs.forEach(t=>{ let c=t; for(let i=0;i<4&&step[c];i++) c=step[c]; if(by[c]) out[t]=by[c]; });
  return out;
}
async function loadThumbs(){
  if(typeof fetch!=='function') return;
  const keys=Object.keys(PIC);
  // 1) 用條目名稱一次批次查（英文維基）
  const byTitle={};
  keys.forEach(k=>{ if(PIC[k].t) (byTitle[PIC[k].t]=byTitle[PIC[k].t]||[]).push(k); });
  const titles=Object.keys(byTitle);
  for(let i=0;i<titles.length;i+=40){
    const part=titles.slice(i,i+40);
    try{
      const j=await jget(wikiURL('en','redirects=1&titles='+encodeURIComponent(part.join('|'))));
      const got=pickThumbs(j,part);
      Object.keys(got).forEach(t=>byTitle[t].forEach(k=>IMGU[k]=got[t]));
    }catch(e){}
  }
  applyThumbs();
  // 2) 沒抓到的，改用該語系條目名或全文搜尋
  for(const k of keys){
    if(IMGU[k]) continue;
    const p=PIC[k];
    try{
      if(p.t2){
        const j=await jget(wikiURL(p.t2[0],'redirects=1&titles='+encodeURIComponent(p.t2[1])));
        const g=pickThumbs(j,[p.t2[1]]); if(g[p.t2[1]]){ IMGU[k]=g[p.t2[1]]; applyThumbs(); continue; }
      }
      const qq=p.q||p.t||(P[k]&&P[k].q); if(!qq) continue;
      const j2=await jget(wikiURL('en','generator=search&gsrlimit=1&gsrsearch='+encodeURIComponent(qq)));
      const pg=((j2.query||{}).pages||[])[0];
      if(pg&&pg.thumbnail){ IMGU[k]=pg.thumbnail.source; applyThumbs(); }
    }catch(e){}
  }
  PSTAT.done=1; picStat();
  // 3) 還是沒有的，用座標找該地點附近的實景照片
  for(const k of keys){
    if(IMGU[k]||!P[k]) continue;
    const ll=P[k].ll; if(!ll) continue;
    try{
      const u='https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&formatversion=2'+
        '&generator=geosearch&ggsnamespace=6&ggslimit=10&ggsradius=300&ggscoord='+ll[0]+'|'+ll[1]+
        '&prop=imageinfo&iiprop=url|mime|size&iiurlwidth=480';
      const j=await jget(u);
      const pgs=((j.query||{}).pages||[]).filter(p=>{
        const i=(p.imageinfo||[])[0]; return i&&i.mime==='image/jpeg'&&i.width>=640;
      });
      if(pgs.length){ IMGU[k]=pgs[0].imageinfo[0].thumburl; applyThumbs(); }
    }catch(e){}
  }
  PSTAT.done=1; picStat();
}
function thumbHTML(k,cls){
  if(!k||!P[k]) return '';
  return '<span class="thumb '+(cls||'')+'" title="'+KLB(k)+'"><span class="ico">'+ICO(k)+'</span>'+
         '<img class="th" data-pk="'+k+'" alt="'+P[k].n+'" loading="lazy" referrerpolicy="no-referrer"></span>';
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function scaleBar(s,fs){
  const latm=(2*Math.atan(Math.exp(s.lat1*Math.PI/180))-Math.PI/2)*0+s.lat1;
  const kmU=111.32*Math.cos(latm*Math.PI/180)/(s.k*Math.PI/180);
  const target=s.w*0.22*kmU;
  const nice=[0.2,0.5,1,2,5,10,20,50,100,200,500,1000];
  let v=nice[0]; for(const n of nice) if(n<=target) v=n;
  const px=v/kmU, x=34, y=s.h-30;
  return '<g stroke="'+MC.ink+'" stroke-width="'+(fs*0.09)+'" opacity=".65">'+
   '<path d="M'+x+' '+y+'h'+px.toFixed(0)+'M'+x+' '+(y-fs*0.28)+'v'+(fs*0.56)+'M'+(x+px).toFixed(0)+' '+(y-fs*0.28)+'v'+(fs*0.56)+'"/></g>'+
   '<text x="'+(x+px/2).toFixed(0)+'" y="'+(y-fs*0.45)+'" text-anchor="middle" font-size="'+(fs*0.72)+'" fill="'+MC.ink+'" opacity=".7">'+(v<1?v*1000+' m':v+' km')+'</text>';
}
function buildMap(cfg,mini){
  const s=SCN[cfg.sc]; if(!s) return '';
  const asp=s.h/s.w, fs=38*Math.max(1,Math.min(asp,1.8));
  const sea=SEA_SCENES[cfg.sc];
  let g='<rect width="'+s.w+'" height="'+s.h+'" fill="'+(sea?MC.sea:MC.land)+'"/>';
  for(const l of s.layers){
    if(l.c==='land')      g+='<path d="'+l.d+'" fill="'+MC.land+'" stroke="'+MC.line+'" stroke-width="'+(fs*0.06)+'"/>';
    else if(l.c==='hi')   g+='<path d="'+l.d+'" fill="'+MC.hi+'" stroke="'+MC.line+'" stroke-width="'+(fs*0.06)+'"/>';
    else if(l.c==='water')g+='<path d="'+l.d+'" fill="'+MC.sea+'" stroke="'+MC.line+'" stroke-width="'+(fs*0.05)+'"/>';
    else if(l.c==='adm1') g+='<path d="'+l.d+'" fill="none" stroke="'+MC.line+'" stroke-width="'+(fs*0.05)+'"/>';
    else if(l.c==='riv')  g+='<path d="'+l.d+'" fill="none" stroke="'+MC.riv+'" stroke-width="'+(fs*0.08)+'" stroke-linejoin="round"/>';
    else if(l.c==='rivbig')g+='<path d="'+l.d+'" fill="none" stroke="'+MC.riv+'" stroke-width="'+(fs*0.22)+'" stroke-linecap="round" stroke-linejoin="round"/>';
  }
  for(const lb of s.labels){
    const big=!lb.w;
    g+='<text x="'+lb.x+'" y="'+lb.y+'" text-anchor="middle" font-size="'+(fs*(big?0.82:0.7))+'" fill="'+(big?'#6b7a86':'#5d7f96')+'" font-weight="'+(big?700:500)+'" paint-order="stroke" stroke="#fff" stroke-width="'+(fs*0.12)+'" stroke-linejoin="round">'+esc(lb.zh)+'</text>';
    if(big&&lb.en) g+='<text x="'+lb.x+'" y="'+(lb.y+fs*0.8)+'" text-anchor="middle" font-size="'+(fs*0.6)+'" fill="#8a969f" paint-order="stroke" stroke="#fff" stroke-width="'+(fs*0.1)+'">'+esc(lb.en)+'</text>';
  }
  // 投影＋出界夾在邊緣
  const m=fs*1.1, P=cfg.pts.map(p=>{
    let [x,y]=prj(s,p.ll[0],p.ll[1]); let out=0;
    if(x<m){x=m;out=1} if(x>s.w-m){x=s.w-m;out=1}
    if(y<m){y=m;out=1} if(y>s.h-m){y=s.h-m;out=1}
    return {x,y,out,p};
  });
  const col=cfg.color||'#a8412a';
  let route='';
  for(let i=1;i<P.length;i++){
    const dash=(P[i].p.air||P[i].out||P[i-1].out)?' stroke-dasharray="'+(fs*0.4)+' '+(fs*0.32)+'"':'';
    route+='<path d="M'+P[i-1].x.toFixed(0)+' '+P[i-1].y.toFixed(0)+'L'+P[i].x.toFixed(0)+' '+P[i].y.toFixed(0)+'" fill="none" stroke="'+col+'" stroke-width="'+(fs*0.17)+'" stroke-linecap="round" opacity=".85"'+dash+'/>';
  }
  if(cfg.ret!==undefined){
    const a=P[P.length-1],b=P[cfg.ret];
    route+='<path d="M'+a.x.toFixed(0)+' '+a.y.toFixed(0)+'L'+b.x.toFixed(0)+' '+b.y.toFixed(0)+'" fill="none" stroke="'+col+'" stroke-width="'+(fs*0.15)+'" stroke-dasharray="'+(fs*0.35)+' '+(fs*0.3)+'" opacity=".6"/>';
  }
  g+=route;
  const r=fs*0.66;
  const tw=t=>{let w=0;for(const ch of String(t))w+=(ch.charCodeAt(0)>0x2e80?0.95:0.5);return w*fs*0.82};
  P.forEach(q=>{
    const p=q.p; let lp=p.lp||'r';
    const W=tw(p.t+(q.out?' ↗':''));
    if(lp==='r'&&q.x+r*1.35+W>s.w-14) lp='l';
    if(lp==='l'&&q.x-r*1.35-W<14) lp='r';
    let tx=q.x,ty=q.y,anc='middle';
    if(lp==='r'){tx=q.x+r*1.35;ty=q.y+fs*0.3;anc='start'}
    else if(lp==='l'){tx=q.x-r*1.35;ty=q.y+fs*0.3;anc='end'}
    else if(lp==='t'){ty=q.y-r*1.3}
    else {ty=q.y+r*1.3+fs*0.75}
    if(anc==='middle'){ tx=Math.min(Math.max(tx,14+W/2), s.w-14-W/2); ty=Math.min(Math.max(ty,fs), s.h-14); }
    else if(anc==='start'){ tx=Math.min(tx, s.w-14-W); }
    else { tx=Math.max(tx, 14+W); }
    g+='<circle cx="'+q.x.toFixed(0)+'" cy="'+q.y.toFixed(0)+'" r="'+r.toFixed(0)+'" fill="'+col+'" stroke="#fff" stroke-width="'+(fs*0.12)+'"/>'+
       '<text x="'+q.x.toFixed(0)+'" y="'+(q.y+fs*0.3).toFixed(0)+'" text-anchor="middle" font-size="'+(fs*0.82)+'" font-weight="700" fill="#fff">'+esc(p.n)+'</text>'+
       '<text x="'+tx.toFixed(0)+'" y="'+ty.toFixed(0)+'" text-anchor="'+anc+'" font-size="'+(fs*0.82)+'" font-weight="600" fill="'+MC.ink+'" paint-order="stroke" stroke="#fff" stroke-width="'+(fs*0.24)+'" stroke-linejoin="round">'+esc(p.t)+(q.out?' ↗':'')+'</text>';
  });
  g+=scaleBar(s,fs);
  g+='<text x="'+(s.w-30)+'" y="'+(fs*1.5)+'" text-anchor="end" font-size="'+(fs*0.85)+'" font-weight="700" fill="'+MC.ink+'" opacity=".55">N ↑</text>';
  return '<svg viewBox="0 0 '+s.w+' '+s.h+'" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" class="mapsvg'+(mini?' mini':'')+'" role="img">'+g+'</svg>';
}

const LOCI={
 prague:['cz','布拉格','br'], 'prague-wide':['cz','布拉格','br'], 'cz-region':['cz','布拉格 ↔ 卡羅維瓦利','tl'],
 'kv-town':['cz','卡羅維瓦利','tl'], tampere:['fi','坦佩雷','br'], rovaniemi:['fi','羅瓦涅米','br'],
 helsinki:['fi','赫爾辛基','tl'], 'helsinki-c':['fi','赫爾辛基','br']
};
function buildLocator(sceneId){
  const cfg=LOCI[sceneId]; if(!cfg) return '';
  const ins=SCN['inset-'+cfg[0]], sc=SCN[sceneId]; if(!ins||!sc) return '';
  const bb=sc.bbox, cx=(bb[0]+bb[2])/2, cy=(bb[1]+bb[3])/2;
  let g='<rect width="'+ins.w+'" height="'+ins.h+'" fill="'+MC.sea+'"/>';
  for(const l of ins.layers)
    g+='<path d="'+l.d+'" fill="'+(l.c==='hi'?MC.hi:MC.land)+'" stroke="#fff" stroke-width="1.6"/>';
  const a=prj(ins,bb[3],bb[0]), b=prj(ins,bb[1],bb[2]), p=prj(ins,cy,cx);
  const w=Math.abs(b[0]-a[0]), hh=Math.abs(b[1]-a[1]);
  if(w>14||hh>14) g+='<rect x="'+a[0].toFixed(1)+'" y="'+a[1].toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+hh.toFixed(1)+
      '" fill="none" stroke="#b3341d" stroke-width="4"/>';
  else g+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="9" fill="#b3341d" stroke="#fff" stroke-width="3.5"/>';
  const name=cfg[0]==='cz'?'捷克 CZECHIA':'芬蘭 FINLAND';
  return '<div class="loc loc-'+cfg[2]+' loc-'+cfg[0]+'"><svg viewBox="0 0 '+ins.w+' '+ins.h+'" xmlns="http://www.w3.org/2000/svg" '+
    'preserveAspectRatio="xMidYMid meet" role="img" aria-label="'+name+'定位圖">'+g+'</svg>'+
    '<b>'+name+'</b><span>'+cfg[1]+'</span></div>';
}
function dayMapCfg(i){
  return DAYPT[i].map(c=>Object.assign({},c,{color:CITY[DAYS[i].city].c}));
}
function mapFigure(c,mini){
  return '<figure class="mapbox'+(mini?' mini':'')+'"><div class="mapwrap">'+buildMap(c,mini)+
    buildLocator(c.sc)+'</div>'+(c.cap?'<figcaption>'+esc(c.cap)+'</figcaption>':'')+'</figure>';
}
function dayMapHTML(i,mini){ return dayMapCfg(i).map(c=>mapFigure(c,mini)).join(''); }

    return [['prg','布拉格','9/10–12 · 9/22–24','charles'],['tre','坦佩雷','9/12–16','nasi'],

      .map(c=>({q:CITY[c[0]].n,n:c[1],d:c[2],k:c[3]}));

  const day=DAYS[sel], seen={}, out=[];
  day.items.forEach(it=>{ if(it.p&&!seen[it.p]){seen[it.p]=1; out.push({q:P[it.p].q,n:P[it.p].n,d:(it.tl||it.t||'')+'　'+KLB(it.p),k:it.p});} });

/* ============ 分頁 ============ */
const VIEWS={'tab-today':'view-today','tab-all':'view-all','tab-map':'view-map','tab-book':'view-book'};
document.querySelectorAll('nav.tabs button').forEach(b=>{
  b.addEventListener('click',()=>{
    Object.keys(VIEWS).forEach(id=>{
      const on=id===b.id;
      document.getElementById(id).setAttribute('aria-selected',on);
      document.getElementById(VIEWS[id]).hidden=!on;
    });
    window.scrollTo({top:0});
    if(b.id==='tab-map') renderMapTab();
  });
});

/* ============ 啟動 ============ */
let lastKey=null;
function curKey(){ const c=current(Date.now()).cur; return c?c.di+'-'+c.ii:'none'; }
function refresh(){ const k=curKey(); if(k!==lastKey){ lastKey=k; renderToday(); renderAll(); applyThumbs(); } }
tickNow(); refresh();
loadThumbs();
setInterval(()=>{ tickNow(); refresh();
loadThumbs(); },15000);
addEventListener('scroll',()=>{ $('#nowbar').classList.toggle('compact',scrollY>110); },{passive:true});
</script>
